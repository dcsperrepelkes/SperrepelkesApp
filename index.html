<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dartsclub De Sperrepelkes</title>
<meta name="description" content="Kalender en rangschikking van Dartsclub De Sperrepelkes" />
<meta name="theme-color" content="#1B4332" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sperrepelkes" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Topbalk -->
<header class="topbar">
  <h1 id="clubNaam">Dartsclub De Sperrepelkes</h1>
</header>

<!-- Sub-tabs: Reeks A / B / C / D -->
<nav class="reeks-tabs" id="reeksTabs" role="tablist" aria-label="Reeks"></nav>

<!-- Inhoud -->
<main id="content">
  <div class="content-toolbar">
    <span id="bewerkingsdatum" class="bewerkingsdatum">Laatst gewijzigd: onbekend</span>
    <button id="refreshBtn" class="icon-btn" title="Vernieuwen" aria-label="Vernieuwen">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <div id="errorBanner" class="error-banner hidden"></div>

  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
  </div>

  <div id="kalenderView" class="view hidden"></div>
  <div id="rangschikkingView" class="view hidden"></div>
</main>

<!-- Modal voor spelerdetails -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button id="modalClose" class="icon-btn" aria-label="Sluiten">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M18.3 5.71 12 12.01l-6.3-6.3-1.41 1.41 6.3 6.3-6.3 6.29 1.41 1.41 6.3-6.29 6.3 6.29 1.41-1.41-6.3-6.29 6.3-6.3z"/></svg>
      </button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- Onderbalk -->
<nav class="bottom-nav" aria-label="Hoofdnavigatie">
  <button class="nav-item active" data-section="kalender" aria-label="Kalender">
    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7 11h5v5H7zM19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
    <span>Kalender</span>
  </button>
  <button class="nav-item" data-section="rangschikking" aria-label="Rangschikking">
    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    <span>Rangschikking</span>
  </button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
